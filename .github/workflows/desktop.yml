name: Checks
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          architecture: arm64
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart analyze lib test tool/stress_main.dart tool/capture_desktop_ui_test.dart
      - run: flutter test --reporter expanded
      - name: Validate packaging tools
        run: |
          python3 -m py_compile packaging/macos/package_macos.py tool/package-source.py tool/verify-release-assets.py tool/sync_release_notices.py
          python3 tool/test_sync_release_notices.py
          python3 tool/test_verify_release_assets.py
          bash -n tool/package-macos.sh
          pwsh -NoProfile -File tool/windows/test-packaging.ps1
          pwsh -NoProfile -File tool/windows/test-crash-diagnostics.ps1
